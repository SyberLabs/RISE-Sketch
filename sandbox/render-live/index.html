<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Render live sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.3 system-ui, sans-serif; }
    #stage { position: absolute; inset: 0; isolation: isolate; }
    #stage > .ground { position: absolute; inset: 0; }
    #stage > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    #label { position: absolute; left: 12px; top: 10px; z-index: 10; color: rgba(255,255,255,.55); letter-spacing: .02em; pointer-events: none; white-space: pre; }
    .paper #label { color: rgba(40,30,20,.6); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="label"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
