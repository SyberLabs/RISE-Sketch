<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rise input sandbox</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #cfd6e4; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  #stage { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #log { position: fixed; top: 8px; right: 8px; width: 360px; max-height: calc(100% - 16px); overflow: hidden; margin: 0;
         padding: 8px 10px; background: rgba(13, 15, 20, 0.82); border: 1px solid #2a3040; border-radius: 6px; pointer-events: none; white-space: pre; }
  #chrome { position: fixed; left: 8px; bottom: 8px; }
  #chrome button { font: inherit; color: inherit; background: #1b2030; border: 1px solid #2a3040; border-radius: 6px; padding: 6px 10px; }
</style>
</head>
<body>
<div id="stage"><canvas id="ink"></canvas></div>
<pre id="log"></pre>
<div id="chrome">
  <button id="ui">UI button (outside the canvas)</button>
  <span role="radiogroup" aria-label="Tiles"><button id="radio" role="radio" aria-checked="true">Radio tile</button></span>
  <button id="eater">Widget that consumes B</button>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
